# CI-only overlay for the visual-diff build. ci-config.rb widens its plugins
# list with the site's own, and the result is layered over the caller site's
# _config.yml, so the site's real url/baseurl (the subdomain-flip story) stays
# untouched in production.
#
# Two things the diff build needs that production deliberately omits:
#   - url:      jekyll-sitemap emits nothing without a url.
#   - plugins:  jekyll-sitemap is an OPTIONAL GitHub Pages plugin (bundled by
#               the github-pages gem but not auto-enabled); it must be listed.
url: "http://localhost:4000"
plugins:
  - jekyll-sitemap
